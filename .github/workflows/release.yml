name: Release

on:
  push:
    branches: [main]
  # Canary snapshots publish from this workflow too. npm trusted publishing is
  # tied to a workflow file name, so one file means one trust entry per package.
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to publish canary from (defaults to the branch the workflow is run on)"
        required: false
        type: string

permissions: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

# npm auth is OIDC trusted publishing (no NPM_TOKEN). Each public package has a
# trusted publisher for Dave-London/Pare + release.yml on npmjs.com; see
# scripts/npm-trust.sh. setup-node needs no registry-url: npm defaults to
# registry.npmjs.org, and without a token there is no .npmrc auth to write.

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # pnpm 10 hands the packed tarball to the npm CLI on PATH; trusted
      # publishing needs npm >= 11.5.1 (Node 22 bundles npm 10).
      - run: npm install -g npm@11.21.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # v2 requires the token as an input; the env GITHUB_TOKEN below must
          # match it (changelog-github reads the env during `changeset version`).
          github-token: ${{ steps.app-token.outputs.token }}
          # Use our version script (changeset version + server.json sync) instead
          # of the action's default `changeset version`, so the "version packages"
          # PR keeps each server.json version aligned with its package.json.
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true

      # A green publish step is not proof the versions are installable: the
      # registry can take several minutes to show them (#1189). Wait up to 15
      # minutes for every published version, and fail the run if one is missing.
      - name: Verify published versions are on the registry
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published-packages }}
        run: |
          deadline=$((SECONDS + 900))
          pending=$(echo "$PUBLISHED" | jq -r '.[] | "\(.name)@\(.version)"')
          while :; do
            still=""
            for spec in $pending; do
              npm view "$spec" version --prefer-online >/dev/null 2>&1 || still="$still $spec"
            done
            pending=$(echo $still)
            if [ -z "$pending" ]; then
              echo "All published versions are on the registry."
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Not on the npm registry after 15 minutes: $pending"
              exit 1
            fi
            echo "Waiting for the registry: $pending"
            sleep 30
          done

  canary:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: npm install -g npm@11.21.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Create canary versions
        run: pnpm changeset version --snapshot canary

      - name: Publish canary to npm
        run: pnpm changeset publish --tag canary
        env:
          NPM_CONFIG_PROVENANCE: true
