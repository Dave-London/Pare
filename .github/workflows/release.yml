name: Release

on:
  push:
    branches: [main]
  # Canary snapshots publish from this workflow too. npm trusted publishing is
  # tied to a workflow file name, so one file means one trust entry per package.
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to publish canary from (defaults to the branch the workflow is run on)"
        required: false
        type: string

permissions: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

# npm auth is OIDC trusted publishing (no NPM_TOKEN). Each public package has a
# trusted publisher for Dave-London/Pare + release.yml on npmjs.com; see
# scripts/npm-trust.sh. setup-node needs no registry-url: npm defaults to
# registry.npmjs.org, and without a token there is no .npmrc auth to write.

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # pnpm 10 hands the packed tarball to the npm CLI on PATH; trusted
      # publishing needs npm >= 11.5.1 (Node 22 bundles npm 10).
      - run: npm install -g npm@11.21.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          # v2 requires the token as an input; the env GITHUB_TOKEN below must
          # match it (changelog-github reads the env during `changeset version`).
          github-token: ${{ steps.app-token.outputs.token }}
          # Use our version script (changeset version + server.json sync) instead
          # of the action's default `changeset version`, so the "version packages"
          # PR keeps each server.json version aligned with its package.json.
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true

  canary:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: npm install -g npm@11.21.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Create canary versions
        run: pnpm changeset version --snapshot canary

      - name: Publish canary to npm
        run: pnpm changeset publish --tag canary
        env:
          NPM_CONFIG_PROVENANCE: true
